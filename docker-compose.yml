services:
  cache-init:
    image: urban-drive-tools:4.7.1
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 10001:10001 /workspace/.godot"]
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.25"
    network_mode: none
    volumes:
      - godot_import_cache:/workspace/.godot

  godot-tools:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GODOT_VERSION: "4.7.1"
        GODOT_RELEASE: "stable"
    image: urban-drive-tools:4.7.1
    working_dir: /workspace
    user: godot
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: "2.0"
    network_mode: none
    volumes:
      - .:/workspace
      - godot_import_cache:/workspace/.godot
      - ./exports:/workspace/exports

  test:
    extends:
      service: godot-tools
    depends_on:
      cache-init:
        condition: service_completed_successfully
    command:
      - --headless
      - --path
      - /workspace
      - --scene
      - res://tests/TestRunner.tscn
      - --
      - --report
      - res://reports/test-results.json

  benchmark:
    extends:
      service: godot-tools
    depends_on:
      cache-init:
        condition: service_completed_successfully
    command:
      - --headless
      - --path
      - /workspace
      - --scene
      - res://scenes/CrowdBenchmark.tscn
      - --
      - --benchmark-seconds
      - "600"
      - --report
      - res://reports/benchmark.json

  export-windows:
    extends:
      service: godot-tools
    depends_on:
      cache-init:
        condition: service_completed_successfully
    command:
      - --headless
      - --path
      - /workspace
      - --export-release
      - Windows Desktop
      - /workspace/exports/windows/UrbanDrivePrototype.exe

volumes:
  godot_import_cache:
